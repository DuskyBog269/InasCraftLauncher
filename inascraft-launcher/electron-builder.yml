appId: com.inascraft.launcher
productName: InasCraft
copyright: Copyright © 2024 InasCraft

# Diretório de saída dos arquivos empacotados
directories:
  output: release
  buildResources: assets

# Arquivos a incluir no pacote
files:
  - out/**/*

# Windows — portable (executa direto sem instalar)
win:
  target:
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico

# Linux — AppImage
linux:
  target: AppImage
  icon: assets/icon.png
  category: Game

# macOS — DMG
mac:
  target: dmg
  icon: assets/icon.icns
  category: public.app-category.games

# Auto-update via GitHub Releases
publish:
  provider: github
  owner: YOUR_GITHUB_USER
  repo: YOUR_GITHUB_REPO
  releaseType: release
